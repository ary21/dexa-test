
services:
  # Main Database
  db:
    image: postgres:15-alpine
    container_name: dexa_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: attendance_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Audit Database
  audit_db:
    image: postgres:15-alpine
    container_name: dexa_audit_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: audit_db
    ports:
      - "5433:5432"
    volumes:
      - audit_pgdata:/var/lib/postgresql/data

  # RabbitMQ for Audit Logging
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dexa_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password123
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # MinIO for Profile Photos
  minio:
    image: minio/minio
    container_name: dexa_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web UI
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  audit_pgdata:
  rabbitmq_data:
  minio_data:
