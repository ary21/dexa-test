version: "3.9"

services:
  # ─── NestJS API ──────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: attendance_api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:pass@postgres:5432/attendance_db
      - AUDIT_DATABASE_URL=postgresql://user:pass@postgres-audit:5433/audit_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - RABBITMQ_URL=amqp://user:pass@rabbitmq:5672
      - RABBITMQ_QUEUE_PROFILE_UPDATE=employee.profile.updated
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=attendance-photos
      - SENTRY_DSN=${SENTRY_DSN}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # ─── Employee React App ───────────────────────────────────────
  employee-app:
    build:
      context: ./apps/employee-app
      dockerfile: Dockerfile
    container_name: attendance_employee_app
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped

  # ─── HRD Admin React App ──────────────────────────────────────
  hrd-admin-app:
    build:
      context: ./apps/hrd-admin-app
      dockerfile: Dockerfile
    container_name: attendance_admin_app
    ports:
      - "3002:80"
    depends_on:
      - api
    restart: unless-stopped

  # ─── PostgreSQL Main DB ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: attendance_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: attendance_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── PostgreSQL Audit DB ──────────────────────────────────────
  postgres-audit:
    image: postgres:16-alpine
    container_name: attendance_postgres_audit
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: audit_db
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d audit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── RabbitMQ ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: attendance_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ─── MinIO Object Storage ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: attendance_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_audit_data:
  rabbitmq_data:
  minio_data:
